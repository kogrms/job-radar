name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: job_radar
          POSTGRES_PASSWORD: job_radar
          POSTGRES_DB: job_radar
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U job_radar" --health-interval 3s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://job_radar:job_radar@localhost:5433/job_radar
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
